<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luminae — Bioluminescent Decor Jars | 3D Flip Cards</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="page-header">
    <h1>🌊 Luminae</h1>
    <p>Bottled ocean glow for your shelf. Tap a jar to see the details.</p>
  </header>

  <main class="card-grid">

    <button class="flip-card" data-glow="jelly" aria-label="Flip Jellyfish Blue jar card">
      <div class="flip-card-inner">
        <div class="flip-card-front">
          <div class="jar">
            <div class="jar__glow"></div>
            <div class="jar__lid"></div>
          </div>
          <h2 class="product-name">Jellyfish Blue</h2>
          <p class="product-tag">Deep sea calm</p>
          <span class="tap-hint">Tap to flip ↻</span>
        </div>
        <div class="flip-card-back">
          <h3>Jellyfish Blue</h3>
          <ul class="stat-list">
            <li><span>Glow Color</span><strong>Electric Blue</strong></li>
            <li><span>Glow Duration</span><strong>8 hrs</strong></li>
            <li><span>Scent</span><strong>Sea Salt & Fig</strong></li>
            <li><span>Charge</span><strong>USB-C, 2 hrs</strong></li>
            <li><span>Price</span><strong>$34</strong></li>
          </ul>
          <span class="tap-hint">Tap to flip back ↻</span>
        </div>
      </div>
    </button>

    <button class="flip-card" data-glow="plankton" aria-label="Flip Plankton Teal jar card">
      <div class="flip-card-inner">
        <div class="flip-card-front">
          <div class="jar">
            <div class="jar__glow"></div>
            <div class="jar__lid"></div>
          </div>
          <h2 class="product-name">Plankton Teal</h2>
          <p class="product-tag">Shimmering tide</p>
          <span class="tap-hint">Tap to flip ↻</span>
        </div>
        <div class="flip-card-back">
          <h3>Plankton Teal</h3>
          <ul class="stat-list">
            <li><span>Glow Color</span><strong>Teal Shimmer</strong></li>
            <li><span>Glow Duration</span><strong>10 hrs</strong></li>
            <li><span>Scent</span><strong>Coconut & Lime</strong></li>
            <li><span>Charge</span><strong>USB-C, 2 hrs</strong></li>
            <li><span>Price</span><strong>$34</strong></li>
          </ul>
          <span class="tap-hint">Tap to flip back ↻</span>
        </div>
      </div>
    </button>

    <button class="flip-card" data-glow="angler" aria-label="Flip Anglerfish Amber jar card">
      <div class="flip-card-inner">
        <div class="flip-card-front">
          <div class="jar">
            <div class="jar__glow"></div>
            <div class="jar__lid"></div>
          </div>
          <h2 class="product-name">Anglerfish Amber</h2>
          <p class="product-tag">Warm abyss</p>
          <span class="tap-hint">Tap to flip ↻</span>
        </div>
        <div class="flip-card-back">
          <h3>Anglerfish Amber</h3>
          <ul class="stat-list">
            <li><span>Glow Color</span><strong>Warm Amber</strong></li>
            <li><span>Glow Duration</span><strong>9 hrs</strong></li>
            <li><span>Scent</span><strong>Sandalwood & Amber</strong></li>
            <li><span>Charge</span><strong>USB-C, 2 hrs</strong></li>
            <li><span>Price</span><strong>$36</strong></li>
          </ul>
          <span class="tap-hint">Tap to flip back ↻</span>
        </div>
      </div>
    </button>

    <button class="flip-card" data-glow="coral" aria-label="Flip Coral Reef Pink jar card">
      <div class="flip-card-inner">
        <div class="flip-card-front">
          <div class="jar">
            <div class="jar__glow"></div>
            <div class="jar__lid"></div>
          </div>
          <h2 class="product-name">Coral Reef Pink</h2>
          <p class="product-tag">Sunset shallows</p>
          <span class="tap-hint">Tap to flip ↻</span>
        </div>
        <div class="flip-card-back">
          <h3>Coral Reef Pink</h3>
          <ul class="stat-list">
            <li><span>Glow Color</span><strong>Coral Pink</strong></li>
            <li><span>Glow Duration</span><strong>8 hrs</strong></li>
            <li><span>Scent</span><strong>Grapefruit & Rose</strong></li>
            <li><span>Charge</span><strong>USB-C, 2 hrs</strong></li>
            <li><span>Price</span><strong>$34</strong></li>
          </ul>
          <span class="tap-hint">Tap to flip back ↻</span>
        </div>
      </div>
    </button>

    <button class="flip-card" data-glow="deepsea" aria-label="Flip Deep Sea Violet jar card">
      <div class="flip-card-inner">
        <div class="flip-card-front">
          <div class="jar">
            <div class="jar__glow"></div>
            <div class="jar__lid"></div>
          </div>
          <h2 class="product-name">Deep Sea Violet</h2>
          <p class="product-tag">Midnight trench</p>
          <span class="tap-hint">Tap to flip ↻</span>
        </div>
        <div class="flip-card-back">
          <h3>Deep Sea Violet</h3>
          <ul class="stat-list">
            <li><span>Glow Color</span><strong>Violet Haze</strong></li>
            <li><span>Glow Duration</span><strong>11 hrs</strong></li>
            <li><span>Scent</span><strong>Lavender & Musk</strong></li>
            <li><span>Charge</span><strong>USB-C, 2 hrs</strong></li>
            <li><span>Price</span><strong>$38</strong></li>
          </ul>
          <span class="tap-hint">Tap to flip back ↻</span>
        </div>
      </div>
    </button>

    <button class="flip-card" data-glow="starlight" aria-label="Flip Starlight White jar card">
      <div class="flip-card-inner">
        <div class="flip-card-front">
          <div class="jar">
            <div class="jar__glow"></div>
            <div class="jar__lid"></div>
          </div>
          <h2 class="product-name">Starlight White</h2>
          <p class="product-tag">Surface moonlight</p>
          <span class="tap-hint">Tap to flip ↻</span>
        </div>
        <div class="flip-card-back">
          <h3>Starlight White</h3>
          <ul class="stat-list">
            <li><span>Glow Color</span><strong>Moon White</strong></li>
            <li><span>Glow Duration</span><strong>12 hrs</strong></li>
            <li><span>Scent</span><strong>White Tea & Musk</strong></li>
            <li><span>Charge</span><strong>USB-C, 2 hrs</strong></li>
            <li><span>Price</span><strong>$36</strong></li>
          </ul>
          <span class="tap-hint">Tap to flip back ↻</span>
        </div>
      </div>
    </button>

  </main>

  <footer class="page-footer">
    <p>Luminae · Concept product design · Built with pure CSS 3D transforms</p>
  </footer>

<script>
  document.querySelectorAll('.flip-card').forEach(card => {
    card.addEventListener('click', () => {
      card.classList.toggle('is-flipped');
    });
  });
</script>

</body>
</html>
